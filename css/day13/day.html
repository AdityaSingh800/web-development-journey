<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Responsive Design</title>

    <link rel="stylesheet" href="day.css">

</head>

<body>


    <header class="navbar">

        <div class="container nav-content">

            <h2 class="logo">
                Aditya
            </h2>


            <nav>

                <a href="#">Home</a>

                <a href="#">About</a>

                <a href="#">Projects</a>

                <a href="#">Contact</a>

            </nav>

        </div>

    </header>


    <main>


        <section class="hero">

            <div class="container hero-content">

                <div class="hero-text">

                    <p class="eyebrow">
                        HELLO, I'M
                    </p>

                    <h1>
                        Aditya
                    </h1>

                    <h2>
                        Future Full Stack Developer
                    </h2>

                    <p class="description">
                        I'm learning frontend development
                        and building real-world projects.
                    </p>

                    <button>
                        View My Work
                    </button>

                </div>


                <div class="hero-image">

                    <div>
                        PHOTO
                    </div>

                </div>

            </div>

        </section>


        <section class="projects">

            <div class="container">

                <div class="section-title">

                    <p>
                        MY WORK
                    </p>

                    <h2>
                        Projects
                    </h2>

                </div>


                <div class="project-grid">

                    <div class="project-card">
                        Project 1
                    </div>

                    <div class="project-card">
                        Project 2
                    </div>

                    <div class="project-card">
                        Project 3
                    </div>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
